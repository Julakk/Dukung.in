<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#37a2ea">
<title>Dukung.in</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/dash.css">
</head>
<body class="dk">
<div class="top"><div class="in">
  <h1><a href="/" style="color:inherit;text-decoration:none">Dukung.in</a></h1>
  <p class="lead">Terima dukungan dari penontonmu. Langsung masuk ke saldo.</p>
</div></div>
<div class="sheet">
  <div class="seg"><button type="button" data-m="login" class="on">Masuk</button><button type="button" data-m="register">Daftar</button></div>
  <form id="f">
    <label class="f" for="u">Username</label>
    <input id="u" autocomplete="username" autocapitalize="none" required>
    <div id="dnw" style="display:none">
      <label class="f" for="dn">Nama tampilan</label>
      <input id="dn" placeholder="Nama yang dilihat pendukungmu">
    </div>
    <label class="f" for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <label id="tcw" style="display:none;font-size:13px;line-height:1.5;margin:10px 0"><input id="tc" type="checkbox" style="width:auto;margin-right:8px">Saya setuju dengan <a href="/terms" target="_blank">Syarat dan Ketentuan</a> dan <a href="/privacy" target="_blank">Kebijakan Privasi</a></label>
    <div class="err" id="err"></div>
    <button class="cta" id="btn" type="submit">Masuk</button>
  </form>
</div>
<script>
const $ = s => document.querySelector(s);
let mode = 'login';
if (localStorage.token) location.href = '/dashboard';
function setMode(m) {
  mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#dnw').style.display = m === 'register' ? 'block' : 'none';
  $('#tcw').style.display = m === 'register' ? 'block' : 'none';
  $('#btn').textContent = m === 'register' ? 'Buat akun' : 'Masuk';
  $('#p').autocomplete = m === 'register' ? 'new-password' : 'current-password';
  $('#err').textContent = '';
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
if (location.search.includes('daftar')) setMode('register');
$('#f').onsubmit = async e => {
  e.preventDefault();
  if (mode === 'register' && !$('#tc').checked) { $('#err').textContent = 'Centang persetujuan Syarat dan Ketentuan dulu'; return; }
  $('#btn').disabled = true;
  const body = { username: $('#u').value.trim(), password: $('#p').value, displayName: $('#dn').value.trim(), agree: $('#tc').checked };
  const r = await fetch('/api/' + mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  $('#btn').disabled = false;
  if (!r.ok) { $('#err').textContent = j.error; return; }
  localStorage.token = j.token;
  location.href = '/dashboard';
};
</script>
</body>
</html>
