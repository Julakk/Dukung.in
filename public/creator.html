<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#37a2ea">
<title>Dukung - Dukung.in</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/dash.css">
</head>
<body class="dk">
<div id="gate" style="display:none;position:fixed;inset:0;background:#0b1620;z-index:50;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center">
  <h2>Konten dewasa 18+</h2>
  <p class="mut" style="max-width:26em">Halaman ini ditandai berisi konten untuk usia 18 tahun ke atas.</p>
  <div style="display:flex;gap:10px"><button class="cta" id="g18" style="width:auto;padding:12px 24px">Saya 18+, lanjutkan</button><button class="ghost" style="width:auto;padding:12px 24px" onclick="location.href='/'">Kembali</button></div>
</div>
<div class="top"><div class="in">
  <div class="av" id="av">?</div>
  <h1 id="name">Memuat...</h1>
  <span class="pill" id="cat" style="display:none"></span>
  <p class="lead" id="bio"></p>
  <div class="sls" id="sls"></div>
</div></div>
<div class="sheet">
  <div id="box">
    <h2>Pilih jumlah dukungan</h2>
    <div class="chips" id="chips"></div>
    <label class="f" for="a">Atau tulis sendiri</label>
    <input id="a" type="text" inputmode="numeric" placeholder="Minimal 1.000">
    <label class="f" for="n">Nama kamu</label>
    <input id="n" placeholder="Kosongkan untuk anonim" maxlength="40">
    <label class="f" for="m">Pesan untuk kreator</label>
    <textarea id="m" rows="3" maxlength="200"></textarea>
    <div class="err" id="err"></div>
    <button class="cta" id="go">Dukung</button>
    <p class="mut" style="text-align:center">Bayar dengan QRIS lewat Tripay.</p>
  </div>
  <div class="card" id="done" style="display:none">
    <h2>Dukunganmu terkirim</h2>
    <p class="mut">Terima kasih sudah mendukung. Kreator akan melihat pesanmu.</p>
    <button class="ghost" onclick="location.href=location.pathname">Dukung lagi</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const username = location.pathname.slice(1).replace(/\/$/, '').toLowerCase();
const J = { 'Content-Type': 'application/json' };
const digits = v => String(v).replace(/\D/g, '');

function sync() {
  const d = digits($('#a').value);
  $('#a').value = d ? Number(d).toLocaleString('id-ID') : '';
  $('#go').textContent = d ? 'Dukung Rp' + Number(d).toLocaleString('id-ID') : 'Dukung';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v === d));
}
function chips(list) {
  $('#chips').innerHTML = '';
  list.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.dataset.v = String(v);
    b.textContent = 'Rp' + Number(v).toLocaleString('id-ID');
    b.onclick = () => { $('#a').value = v; sync(); };
    $('#chips').append(b);
  });
}
chips([5000, 10000, 25000, 50000]);

fetch('/api/creator/' + username).then(r => r.json()).then(j => {
  if (j.error) { $('#name').textContent = 'Kreator tidak ditemukan'; $('#box').style.display = 'none'; return; }
  $('#name').textContent = j.displayName;
  $('#bio').textContent = j.bio;
  if (j.avatar) { $('#av').style.backgroundImage = 'url(' + j.avatar + ')'; $('#av').textContent = ''; }
  else $('#av').textContent = (j.displayName.trim()[0] || '?').toUpperCase();
  if (j.category) { $('#cat').textContent = j.category; $('#cat').style.display = 'inline-block'; }
  if (j.banner) { const tp = document.querySelector('.top'); tp.classList.add('hasb'); tp.style.backgroundImage = 'linear-gradient(rgba(6,33,58,.6),rgba(6,33,58,.6)),url(' + j.banner + ')'; }
  (j.links || []).forEach(u => {
    const a = document.createElement('a');
    a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; a.className = 'sl';
    try { a.textContent = new URL(u).hostname.replace(/^www\./, ''); } catch (e) { a.textContent = u; }
    $('#sls').append(a);
  });
  if (j.nsfw && !sessionStorage['ok18:' + username]) $('#gate').style.display = 'flex';
  chips(j.quick);
  document.title = j.displayName + ' - Dukung.in';
});
$('#g18').onclick = () => { sessionStorage['ok18:' + username] = 1; $('#gate').style.display = 'none'; };
$('#a').oninput = sync;

if (new URLSearchParams(location.search).has('thanks')) { $('#box').style.display = 'none'; $('#done').style.display = 'block'; }

$('#go').onclick = async () => {
  $('#err').textContent = '';
  $('#go').disabled = true;
  const body = JSON.stringify({ name: $('#n').value, amount: digits($('#a').value), message: $('#m').value });
  const r = await fetch('/api/creator/' + username + '/support', { method: 'POST', headers: J, body });
  const j = await r.json();
  if (!r.ok) { $('#err').textContent = j.error; $('#go').disabled = false; return; }
  if (j.checkoutUrl) { location.href = j.checkoutUrl; return; }
  await fetch('/api/donations/' + j.id + '/pay', { method: 'POST' });
  $('#box').style.display = 'none';
  $('#done').style.display = 'block';
};
</script>
</body>
</html>
