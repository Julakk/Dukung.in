<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Dukung.in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>Dashboard</h1>
  <div class="card">
    <div class="mut">Link dukunganmu</div>
    <a id="link" style="color:var(--ac);word-break:break-all" target="_blank"></a>
  </div>
  <div class="card">
    <div class="mut">Saldo tersedia</div>
    <div class="big" id="total">Rp0</div>
  </div>
  <div class="card">
    <h2>Overlay OBS</h2>
    <div class="mut">Tempel di OBS sebagai Browser Source. Jangan dibagikan.</div>
    <a id="ov" style="color:var(--ac);word-break:break-all" target="_blank"></a>
    <button class="ghost" id="cp">Salin link</button>
  </div>
  <div class="card">
    <h2>Penarikan dana</h2>
    <div class="mut" id="wnote"></div>
    <input id="wbank" placeholder="Bank / e-wallet (mis. BCA, DANA)">
    <input id="wacc" placeholder="Nomor rekening / HP">
    <input id="whold" placeholder="Nama pemilik rekening">
    <button class="ghost" id="wsave">Simpan rekening</button>
    <input id="wamt" type="text" inputmode="numeric" placeholder="Jumlah penarikan" style="margin-top:14px">
    <div id="werr" class="err"></div>
    <button id="wgo">Tarik dana</button>
    <div id="wlist" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>Ganti password</h2>
    <input id="pold" type="password" placeholder="Password lama" autocomplete="current-password">
    <input id="pnew" type="password" placeholder="Password baru (min. 6)" autocomplete="new-password">
    <div id="perr" class="err"></div>
    <button id="pgo">Ganti password</button>
  </div>
  <div class="card">
    <h2>Profil</h2>
    <input id="dn" placeholder="Nama tampilan">
    <textarea id="bio" rows="3" placeholder="Bio singkat"></textarea>
    <div class="ok" id="msg"></div>
    <button id="save">Simpan</button>
  </div>
  <div class="card">
    <h2>Dukungan masuk</h2>
    <div id="list"></div>
  </div>
  <button class="ghost" id="out">Keluar</button>
</div>
<script>
const $ = s => document.querySelector(s);
const t = localStorage.token;
if (!t) location.href = '/';
const H = { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' };
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');

async function load() {
  const r = await fetch('/api/dashboard', { headers: H });
  if (r.status === 401) { localStorage.removeItem('token'); location.href = '/'; return; }
  const j = await r.json();
  $('#link').textContent = location.origin + '/' + j.user.username;
  $('#link').href = '/' + j.user.username;
  const ovUrl = location.origin + '/overlay/' + j.overlayKey;
  $('#ov').textContent = ovUrl;
  $('#ov').href = ovUrl;
  $('#cp').onclick = () => { navigator.clipboard.writeText(ovUrl); $('#cp').textContent = 'Tersalin'; };
  if (!window._f) $('#dn').value = j.user.displayName;
  if (!window._f) $('#bio').value = j.user.bio;
  $('#total').textContent = rp(j.balance);
  $('#wnote').textContent = 'Total dukungan ' + rp(j.gross) + ', potongan platform ' + j.feePct + '%, bersih ' + rp(j.earned) + '. Minimal tarik ' + rp(j.minWd) + '.';
  if (!window._f) {
    $('#wbank').value = j.payout.bank || '';
    $('#wacc').value = j.payout.account || '';
    $('#whold').value = j.payout.holder || '';
  }
  const lbl = { pending: 'Menunggu', paid: 'Sudah ditransfer', rejected: 'Ditolak' };
  const wl = $('#wlist');
  wl.innerHTML = '';
  j.withdrawals.forEach(w => {
    const el = document.createElement('div');
    el.className = 'item';
    const b = document.createElement('b');
    b.textContent = rp(w.amount) + ' • ' + (lbl[w.status] || w.status);
    const p = document.createElement('p');
    p.textContent = new Date(w.createdAt).toLocaleString('id-ID') + (w.note ? ' • ' + w.note : '');
    el.append(b, p);
    wl.append(el);
  });
  window._f = 1;
  const box = $('#list');
  box.innerHTML = '';
  if (!j.donations.length) box.innerHTML = '<div class="mut">Belum ada dukungan.</div>';
  j.donations.forEach(d => {
    const el = document.createElement('div');
    el.className = 'item';
    const b = document.createElement('b');
    b.textContent = d.name + ' • ' + rp(d.amount);
    const p = document.createElement('p');
    p.textContent = d.message || '-';
    el.append(b, p);
    box.append(el);
  });
}
$('#save').onclick = async () => {
  await fetch('/api/me', { method: 'PUT', headers: H, body: JSON.stringify({ displayName: $('#dn').value, bio: $('#bio').value }) });
  $('#msg').textContent = 'Tersimpan';
  setTimeout(() => $('#msg').textContent = '', 1500);
};
$('#out').onclick = async () => {
  await fetch('/api/logout', { method: 'POST', headers: H });
  localStorage.removeItem('token');
  location.href = '/';
};
load();
$('#wsave').onclick = async () => {
  const r = await fetch('/api/payout', { method: 'PUT', headers: H, body: JSON.stringify({ bank: $('#wbank').value, account: $('#wacc').value, holder: $('#whold').value }) });
  const j = await r.json();
  $('#werr').className = r.ok ? 'ok' : 'err';
  $('#werr').textContent = r.ok ? 'Rekening tersimpan' : j.error;
};
$('#wgo').onclick = async () => {
  const r = await fetch('/api/withdraw', { method: 'POST', headers: H, body: JSON.stringify({ amount: $('#wamt').value.replace(/\D/g, '') }) });
  const j = await r.json();
  $('#werr').className = r.ok ? 'ok' : 'err';
  $('#werr').textContent = r.ok ? 'Permintaan terkirim' : j.error;
  if (r.ok) { $('#wamt').value = ''; load(); }
};
$('#pgo').onclick = async () => {
  const r = await fetch('/api/password', { method: 'POST', headers: H, body: JSON.stringify({ old: $('#pold').value, new: $('#pnew').value }) });
  const j = await r.json();
  $('#perr').className = r.ok ? 'ok' : 'err';
  $('#perr').textContent = r.ok ? 'Password diganti' : j.error;
  if (r.ok) { $('#pold').value = ''; $('#pnew').value = ''; }
};
setInterval(load, 15000);
</script>
</body>
</html>
