<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay - Dukung.in</title>
<style>
html,body{margin:0;background:transparent;font-family:system-ui,sans-serif;overflow:hidden}
#a{--cy:0%;--off:0px;position:fixed;left:50%;width:min(460px,92%);box-sizing:border-box;padding:16px 20px;text-align:center;border:2px solid;border-radius:16px;opacity:0;transform:translate(-50%,calc(var(--cy) + var(--off)));transition:transform .5s ease,opacity .5s ease}
#a.top{top:24px}
#a.bottom{bottom:24px}
#a.center{top:50%;--cy:-50%}
#a.show{opacity:1}
#a.slide:not(.show){--off:-60px}
#a.slide.bottom:not(.show){--off:60px}
#a.none{transition:none}
#t{font-weight:800}
#m{margin-top:6px;opacity:.9;word-break:break-word}
#hint{position:fixed;bottom:8px;left:8px;font-size:12px;color:#888;display:none}
</style>
</head>
<body>
<div id="a"><div id="t"></div><div id="m"></div></div>
<div id="hint">Ketuk layar untuk mengaktifkan suara</div>
<script>
const key = location.pathname.split('/').pop();
const test = new URLSearchParams(location.search).has('test');
const el = document.getElementById('a');
let cfg = { bg: '#37a2ea', border: '#ffffff', text: '#06213a', hi: '#ffffff', size: 18, pos: 'top', dur: 8, tpl: '{sender} memberi {amount}', cur: true, anim: 'slide', sound: true };
const queue = [];
let showing = false, since = null, ctx = null;

function beep() {
  if (!cfg.sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.15;
      g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
document.body.addEventListener('click', () => { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); document.getElementById('hint').style.display = 'none'; });

function next() {
  if (showing || !queue.length) return;
  showing = true;
  const d = queue.shift();
  el.style.background = cfg.bg; el.style.borderColor = cfg.border; el.style.color = cfg.text; el.style.fontSize = cfg.size + 'px';
  el.className = cfg.pos + ' ' + cfg.anim;
  const t = document.getElementById('t');
  t.textContent = '';
  cfg.tpl.split(/(\{sender\}|\{amount\})/).forEach(p => {
    if (p === '{sender}' || p === '{amount}') {
      const s = document.createElement('span');
      s.style.color = cfg.hi;
      s.textContent = p === '{sender}' ? d.name : (cfg.cur ? 'Rp' : '') + Number(d.amount).toLocaleString('id-ID');
      t.append(s);
    } else if (p) t.append(document.createTextNode(p));
  });
  document.getElementById('m').textContent = d.message || '';
  setTimeout(() => el.classList.add('show'), 30);
  beep();
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => { showing = false; next(); }, 700); }, cfg.dur * 1000);
}

async function loadCfg() {
  try { const r = await fetch('/api/overlay/' + key + '/config'); if (r.ok) cfg = await r.json(); } catch (e) {}
}
async function poll() {
  try {
    const r = await fetch('/api/overlay/' + key + '/poll' + (since === null ? '' : '?since=' + since));
    if (!r.ok) return;
    const j = await r.json();
    if (since === null) since = j.now;
    j.donations.forEach(d => { queue.push(d); if (d.paidAt > since) since = d.paidAt; });
    next();
  } catch (e) {}
}

(async () => {
  await loadCfg();
  if (test) {
    document.body.style.background = '#0f1117';
    document.getElementById('hint').style.display = 'block';
    queue.push({ name: 'Tester', amount: 25000, message: 'Semangat terus bang!' });
    next();
  }
  poll();
  setInterval(poll, 3000);
  setInterval(loadCfg, 60000);
})();
</script>
</body>
</html>
